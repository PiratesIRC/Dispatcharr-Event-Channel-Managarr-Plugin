name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pytest python-dateutil pytz ruff

      # Every shipped module, found by pattern rather than named one at a time.
      # The previous hand-written list covered plugin.py and ecm_parsing.py only,
      # so ecm_profiles.py and __init__.py shipped with no compile gate at all.
      # A list that must be edited whenever a module is added is a list that will
      # be forgotten.
      - name: Compile check
        run: |
          shopt -s nullglob
          files=(Event-Channel-Managarr/*.py)
          if [ ${#files[@]} -eq 0 ]; then echo "no plugin sources found"; exit 1; fi
          printf 'compiling %s\n' "${files[@]}"
          python -m py_compile "${files[@]}"
        shell: bash

      - name: Validate plugin.json
        run: python -c "import json; json.load(open('Event-Channel-Managarr/plugin.json'))"

      - name: Lint
        # Enforced. The `continue-on-error: true` that used to sit here made this
        # step report green while ruff failed, which it did on every run for
        # months. The 140 standing errors were cleared on 2026-09-05: 127 fixed
        # and 13 exempted per file in pyproject.toml, each with the reason
        # obeying the rule would break the code. A NEW error now fails CI.
        run: ruff check .

      - name: Tests
        run: pytest

      # Guards against backslash-separator release zips (Stream-Mapparr bug-087):
      # validates any committed release zip; no-op when none is checked in.
      - name: Validate committed release zip(s)
        run: |
          shopt -s globstar nullglob
          zips=(**/*.zip)
          if [ ${#zips[@]} -eq 0 ]; then echo "No committed release zip — skipping."; exit 0; fi
          rc=0
          for z in "${zips[@]}"; do
            echo "::group::$z"; python scripts/validate_zip.py "$z" || rc=1; echo "::endgroup::"
          done
          exit $rc
